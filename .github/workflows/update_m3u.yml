name: Update M3U

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r m3u/requirements.txt

      - name: Build optimized M3U
        run: python3 scripts/optimize_m3u.py

      - name: Commit playlist and build stats
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add listtivi.m3u m3u/cache/build_stats.json m3u/cache/epg.xml
          git commit -m 'Auto update M3U' || echo 'No changes'
          git push
