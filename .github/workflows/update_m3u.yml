name: Auto Update M3U (external trigger)

on:
  # Kich hoat tu CRON NGOAI (khong dung GitHub Actions schedule nua, vi ban
  # da tu quan ly lich chay ben ngoai de kiem soat chinh xac thoi diem).
  repository_dispatch:
    types: [update-m3u]
  # Van giu nut bam thu cong tren GitHub de test/chay tay khi can.
  workflow_dispatch:

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Build M3U
      run: python3 scripts/optimize_m3u.py

    - name: Commit and push
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add "listtivi.m3u" "vnepg_backup.json"
        git commit -m "Auto update: refresh vnepg_backup.json via VN proxies + rebuild listtivi.m3u" || echo "No changes"
        git push
