name: Auto Update M3U

on:
  repository_dispatch:
    types:
      - update_m3u

  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"


concurrency:
  group: m3u-update
  cancel-in-progress: true


permissions:
  contents: write


jobs:

  update-list:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout main repository
      # ------------------------------------------------------

      - name: Checkout source repository
        uses: actions/checkout@v6


      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: m3u/requirements.txt


      # ------------------------------------------------------
      # Cache iptv-org metadata
      # ------------------------------------------------------

      - name: Cache IPTV metadata
        uses: actions/cache@v4
        with:
          path: .cache/iptv
          key: iptv-meta-${{ runner.os }}-${{ hashFiles('m3u/channel_aliases.yml') }}
          restore-keys: |
            iptv-meta-${{ runner.os }}-


      # ------------------------------------------------------
      # Install
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r m3u/requirements.txt


      # ------------------------------------------------------
      # Build
      # ------------------------------------------------------

      - name: Build optimized M3U
        env:
          PYTHONPATH: .
          META_CACHE_TTL: "86400"
          MIN_CHANNELS: "100"
          MIN_RATIO: "0.70"
        run: |
          python scripts/optimize_m3u.py


      # ------------------------------------------------------
      # Copy only fallback into main repo
      # ------------------------------------------------------

      - name: Update fallback playlist
        run: |
          mkdir -p m3u
          cp listtivi.m3u m3u/listtivi.m3u


      # ------------------------------------------------------
      # Commit fallback only
      # ------------------------------------------------------

      - name: Commit fallback playlist
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add m3u/listtivi.m3u

          git diff --cached --quiet || \
            git commit -m "Auto update fallback M3U"

          git push || true


      # ------------------------------------------------------
      # Checkout GitHub Pages repository
      # ------------------------------------------------------

      - name: Checkout Pages repository
        uses: actions/checkout@v6
        with:
          repository: vhd0/vhd0.github.io
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-repo


      # ------------------------------------------------------
      # Copy playlist
      # ------------------------------------------------------

      - name: Copy final playlist to Pages
        run: |
          mkdir -p pages-repo/IPTV
          cp listtivi.m3u pages-repo/IPTV/listtivi.m3u


      # ------------------------------------------------------
      # Commit and push Pages
      # ------------------------------------------------------

      - name: Commit and push Pages repository
        working-directory: pages-repo
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add IPTV/listtivi.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes."
            exit 0
          fi

          git commit -m "Auto update listtivi.m3u"
          git push


      # ------------------------------------------------------
      # Cleanup generated files
      # ------------------------------------------------------

      - name: Cleanup
        if: always()
        run: |
          rm -f listtivi.m3u
          rm -rf pages-repo
