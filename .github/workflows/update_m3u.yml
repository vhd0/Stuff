name: Build IPTV Playlist

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - update_m3u

  schedule:
    - cron: "17 * * * *"

concurrency:
  group: m3u-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: m3u/requirements.txt

      - name: Cache iptv-org API
        uses: actions/cache@v5
        with:
          path: .cache/iptv
          key: iptv-org-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            iptv-org-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r m3u/requirements.txt

      - name: Build playlist
        run: |
          python scripts/optimize_m3u.py

      - name: Check generated playlist
        run: |
          test -s m3u/listtivi.m3u

          echo "Channels:"
          grep -c '^#EXTINF:' m3u/listtivi.m3u

      # ------------------------------------------------------
      # Save fallback in source repo
      # ------------------------------------------------------

      - name: Commit fallback playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add m3u/listtivi.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes."
          else
            git commit -m "chore: update IPTV playlist"
            git push
          fi

      # ------------------------------------------------------
      # Deploy to GitHub Pages repository
      # ------------------------------------------------------

      - name: Checkout Pages repository
        uses: actions/checkout@v6
        with:
          repository: vhd0/vhd0.github.io
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-repo
          fetch-depth: 1

      - name: Copy playlist to Pages
        run: |
          mkdir -p pages-repo/IPTV
          cp m3u/listtivi.m3u pages-repo/IPTV/listtivi.m3u

      - name: Commit Pages playlist
        working-directory: pages-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add IPTV/listtivi.m3u

          if git diff --cached --quiet; then
            echo "No Pages playlist changes."
          else
            git commit -m "chore: update IPTV playlist"
            git push
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -rf pages-repo
