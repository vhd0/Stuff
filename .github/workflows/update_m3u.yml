name: Auto Update M3U Daily

on:
  repository_dispatch:
    types: [update_m3u]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v5
        with:
          path: source-repo

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: source-repo
        run: python -m pip install -r m3u/requirements.txt

      - name: Build M3U
        working-directory: source-repo
        run: python3 optimize_m3u.py

      - name: Checkout Pages repo
        uses: actions/checkout@v5
        with:
          repository: vhd0/vhd0.github.io
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-repo

      - name: Copy final playlist
        run: mkdir -p pages-repo/IPTV && cp source-repo/listtivi.m3u pages-repo/IPTV/listtivi.m3u

      - name: Commit and push Pages repo
        working-directory: pages-repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add IPTV/listtivi.m3u
          git commit -m "Auto update listtivi.m3u" || echo "No playlist changes"
          git push
