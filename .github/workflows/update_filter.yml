name: Update Adblock Plus Custom Filter

on:
  push:
    paths:
      - 'customrules.txt'
  workflow_run:
    workflows: ["Compile Custom Rules"]
    types:
      - completed
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Repository (Stuff)
        uses: actions/checkout@v5

      - name: Set up Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: pip install requests

      - name: Run Filter Compiler
        run: python scripts/compiler.py

      - name: Checkout target repo (vhd0.github.io)
        uses: actions/checkout@v5
        with:
          repository: vhd0/vhd0.github.io
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-repo

      - name: Copy compiled file into ABP folder
        run: |
          mkdir -p pages-repo/ABP
          cp abp.txt pages-repo/ABP/abp.txt

      - name: Commit and Push to vhd0.github.io
        working-directory: pages-repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ABP/abp.txt
          git diff-index --quiet HEAD || (git commit -m "Auto-update filters: $(date -u +'%Y-%m-%d %H:%M:%S') UTC" && git push)
