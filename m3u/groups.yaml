# groups.yaml
# ====================================================================
# 1. GROUP ALIAS (tin tuong TUYET DOI khi nguon co trust_group_title=True)
# Key da duoc chuan hoa: bo dau, chu thuong, chi giu chu/so (khong emoji,
# khong khoang trang, khong dau gach). Xem group_match_key() trong
# m3u/normalize.py.
# ====================================================================
group_alias:
  vtv: "📺 VTV"
  vtvcab: "📡 VTVCab"
  htv: "📺 HTV"
  htvc: "📡 HTVC"
  sctv: "📡 SCTV"
  diaphuong: "🏠 Địa phương"
  thietyeu: "🏠 Địa phương"      # "Kenh thiet yeu" cua TV360/MyTV ~ dia phuong+VTV/HTV co ban
  thethaoquocte: "⚽ Thể thao"
  thethao: "⚽ Thể thao"
  radio: "📻 Radio"
  ukradio: "📻 Radio"
  thieunhi: "👶 Thiếu nhi"
  tvb: "🎭 Giải trí"
  giaitri: "🎭 Giải trí"
  amnhac: "🎵 Âm nhạc"
  tintuc: "📰 Tin tức"
  phim: "🎬 Phim"
  giaoduc: "🎓 Giáo dục & Khám phá"
  # Cac nhom "su kien" cua nhieu OTT khac nhau deu quy ve 1 nhom Su kien.
  liveevents: "🎟️ Sự kiện"
  sukientv360: "🎟️ Sự kiện"
  sukienvtvprime: "🎟️ Sự kiện"
  sukienfptplay: "🎟️ Sự kiện"
  # LUU Y: "In The Box" DA BI GO KHOI danh sach nay (truoc day gan nham
  # thanh "Su kien"). Kiem chung tren nguon TinhLaGi cho thay "📦 In The
  # Box" thuc chat la 1 bundle linh tinh gom kenh PHIM/NHAC (Box Movie,
  # Music Box, Woman, TVB...), khong phai su kien. De rieng ten nhom nay
  # (va cac bundle mo ho tuong tu nhu "⭐ Kênh yêu thích", "🌐 Quốc Tế VIP",
  # "🎬 Rạp Phim") RA KHOI group_alias, de OTT content classifier ben duoi
  # tu phan loai dung theo TEN TUNG KENH thay vi theo bundle chung chung.
  # LUU Y: "Quoc Te" / cac nhom quoc gia (Han Quoc/Trung Quoc/Thai Lan/
  # Campuchia/Israel/UK...) CO CHU Y KHONG duoc liet ke o day (muc 8: khong
  # co nhom "Quoc te" dau ra). Cac nhom nay se roi qua OTT secondary
  # classifier ben duoi, phan loai theo NOI DUNG thay vi theo quoc gia.

# ====================================================================
# 2. OTT SECONDARY CONTENT CLASSIFIER (muc 7)
# Dung khi: (a) nguon khong trust group-title, hoac (b) group-title khong
# khop group_alias o tren (vd cac nhom quoc gia, "Quoc Te" chung chung).
# Khop theo TU KHOA xuat hien trong TEN KENH DA CHUAN HOA (khong dau, chu
# thuong). Kiem tra THEO THU TU, nhom dau tien khop duoc se duoc chon.
# ====================================================================
