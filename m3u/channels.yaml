# channels.yaml
# Quy tac canonical cho tung kenh: bi danh (aliases), nhom phu them
# (extra_groups - muc 11 MULTI-GROUP MEMBERSHIP), va nhan dien dac biet.
#
# Cau truc moi entry:
#   <canonical_id>:
#     name: "<Ten hien thi chuan>"
#     aliases: [<cac bien the ten/tvg-id se duoc gop ve canonical_id nay>]
#     extra_groups: [<nhom phu duoc them vao ben canh nhom chinh>]
#
# canonical_id la khoa noi bo (khong dau, khong khoang trang, chu thuong),
# dung de gop cac bien the "VTV1"/"VTV 1"/"VTV1 HD"/"VTV1 FHD"/"VTV1 1080P"
# ve CUNG 1 kenh (muc 5 CHANNEL IDENTITY).

antv:
  name: "ANTV"
  aliases: ["antv", "antvhd", "an ninh tv", "an ninh"]
  extra_groups: ["📰 Tin tức"]

qpvn:
